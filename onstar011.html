<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북과학고 AI영어(2025수능완성 영어영역 1-3-0) English Paragraphs and Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .large-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .translation {
            color: #16a085;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #13856e;
        }
        #studyMode {
            display: none;
            text-align: center;
        }
        #sentenceDisplay, #wordDisplay {
            margin: 20px auto;
        }
        #sentenceDisplay, #wordDisplay {
            font-size: 56px; /* 문장 학습과 단어 학습의 글자 크기 */
        }
    </style>
</head>
<body>
    <h1>전북과학고 AI영어(2025수능완성 영어영역 1-3-0) English Paragraphs and Vocabulary</h1>

    <div id="content">
        <div id="paragraphs">
            <h2>Paragraph Translation</h2>
        </div>

        <div id="vocabulary">
            <h2>Vocabulary</h2>
        </div>

        <button onclick="startStudyMode()">학습모드</button>
    </div>

    <div id="studyMode">
        <div id="sentenceDisplay"></div>
        <div id="wordDisplay"></div>
    </div>

    <script>
        const paragraphs = [
            { english: "Self-hatred is often characterized by an all-or-nothing mindset ('I did only thirty minutes of exercise instead of an hour, so it doesn’t count.') and a tendency to ruminate by focusing on what has gone wrong without even acknowledging what has gone right.", korean: "자기 혐오는 종종 '나는 1시간 대신 단지 30분만 운동했으니 의미가 없다.'와 같은 흑백 사고방식과, 잘된 것조차 인정하지 않고 잘못된 것에만 집중하는 경향으로 특징지어집니다." },
            { english: "Sometimes we’ll choose not to do something fun like going to a movie or taking a vacation because we 'don’t deserve it.'", korean: "때로는 '우리는 그것을 누릴 자격이 없다.'라는 이유로 영화 보러 가기나 휴가를 가는 것과 같은 재미있는 일을 하지 않기로 결정합니다." },
            { english: "At other times, we diminish our hopes ('It probably won’t work out') because we’re preparing ourselves for failure.", korean: "다른 때는 '아마 잘 안 될 거야.'라고 하며 희망을 줄이는 경우가 있습니다. 이는 실패를 준비하고 있기 때문입니다." },
            { english: "We second-guess our decisions; we think we should have done things differently.", korean: "우리는 우리의 결정을 다시 생각합니다. 우리는 다르게 행동했어야 한다고 생각합니다." },
            { english: "But expressing regret for not doing things perfectly simply strengthens the illusion that perfection is possible.", korean: "하지만 일을 완벽하게 하지 못한 것에 대한 후회를 표현하는 것은 단순히 완벽함이 가능하다는 환상을 강화합니다." },
            { english: "As the psychiatrist Theodore Isaac Rubin wrote, 'If we demand wisdom after the fact, then in effect, we assume an absolute ability to foretell the future and to make no mistakes at all.'", korean: "정신과 의사 테오도르 아이작 루빈이 썼듯이, '만약 우리가 일어난 일에 대해 지혜를 요구한다면, 이는 실질적으로 미래를 예견하고 전혀 실수를 하지 않을 절대적인 능력을 가정하는 것입니다.'" }
        ];

        const vocabulary = {
            "self-hatred": "자기 혐오",
            "often": "종종",
            "characterized": "특징지어지다",
            "by": "에 의해",
            "an": "하나의",
            "all-or-nothing": "흑백",
            "mindset": "사고방식",
            "did": "했다",
            "only": "단지",
            "thirty": "30",
            "minutes": "분",
            "exercise": "운동",
            "instead": "대신",
            "hour": "시간",
            "so": "그래서",
            "doesn’t": "하지 않는다",
            "count": "의미가 있다",
            "and": "그리고",
            "tendency": "경향",
            "ruminate": "반추하다",
            "focusing": "집중하다",
            "on": "에",
            "what": "무엇",
            "has": "가지다",
            "gone": "지나가다",
            "wrong": "잘못된",
            "without": "없이",
            "even": "심지어",
            "acknowledging": "인정하다",
            "right": "옳은",
            "sometimes": "때로는",
            "we’ll": "우리는",
            "choose": "선택하다",
            "not": "아니다",
            "do": "하다",
            "something": "무엇",
            "fun": "재미있는",
            "like": "같은",
            "going": "가다",
            "movie": "영화",
            "taking": "갖다",
            "vacation": "휴가",
            "because": "때문에",
            "deserve": "자격이 있다",
            "at": "때",
            "other": "다른",
            "times": "때",
            "diminish": "줄이다",
            "hopes": "희망",
            "probably": "아마도",
            "won’t": "하지 않을 것이다",
            "work": "작동하다",
            "out": "결과",
            "preparing": "준비하다",
            "ourselves": "우리 자신",
            "failure": "실패",
            "second-guess": "다시 생각하다",
            "decisions": "결정",
            "think": "생각하다",
            "should": "해야 한다",
            "have": "가지다",
            "done": "했다",
            "things": "것들",
            "differently": "다르게",
            "expressing": "표현하다",
            "regret": "후회",
            "perfectly": "완벽히",
            "simply": "단순히",
            "strengthens": "강화하다",
            "illusion": "환상",
            "perfection": "완벽함",
            "possible": "가능한",
            "psychiatrist": "정신과 의사",
            "theodore": "테오도르",
            "isaac": "아이작",
            "rubin": "루빈",
            "wrote": "썼다",
            "if": "만약",
            "demand": "요구하다",
            "wisdom": "지혜",
            "after": "후",
            "fact": "사실",
            "then": "그러면",
            "effect": "효과",
            "assume": "가정하다",
            "absolute": "절대적인",
            "ability": "능력",
            "foretell": "예견하다",
            "future": "미래",
            "make": "만들다",
            "no": "없다",
            "mistakes": "실수들",
            "at": "전혀",
            "all": "모든"
        };

        let sentenceIndex = 0;
        let wordIndex = 0;
        let isRunning = true;

        function startStudyMode() {
            document.getElementById("content").style.display = "none";
            const studyMode = document.getElementById("studyMode");
            studyMode.style.display = "block";

            isRunning = true;

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    isRunning = false;
                    document.getElementById("studyMode").style.display = "none";
                    document.getElementById("content").style.display = "block";
                    sentenceIndex = 0;
                    wordIndex = 0;
                }
            });

            displayNextSentence();
        }

        function displayNextSentence() {
            if (!isRunning) return;

            const sentence = paragraphs[sentenceIndex];
            document.getElementById("sentenceDisplay").innerHTML = `
                <div>${sentence.english}</div>
                <div class="translation">${sentence.korean}</div>
            `;
            sentenceIndex = (sentenceIndex + 1) % paragraphs.length;

            const wordCount = sentence.english.split(" ").length;
            const displayTime = wordCount * 1000;

            setTimeout(() => {
                if (!isRunning) return;
                if (sentenceIndex === 0) {
                    document.getElementById("sentenceDisplay").innerHTML = "";
                    displayNextWord();
                } else {
                    displayNextSentence();
                }
            }, displayTime);
        }

        function displayNextWord() {
            if (!isRunning) return;

            const words = Object.entries(vocabulary);
            const word = words[wordIndex];
            document.getElementById("wordDisplay").innerHTML = `
                <div>${word[0]}</div>
                <div class="translation">${word[1]}</div>
            `;
            wordIndex = (wordIndex + 1) % words.length;

            setTimeout(() => {
                if (!isRunning) return;
                if (wordIndex === 0) {
                    document.getElementById("wordDisplay").innerHTML = "";
                    displayNextSentence();
                } else {
                    displayNextWord();
                }
            }, 2000);
        }

        function populateParagraphs() {
            const paragraphContainer = document.getElementById("paragraphs");
            paragraphs.forEach(paragraph => {
                const englishPara = document.createElement("div");
                englishPara.className = "large-text";
                englishPara.textContent = paragraph.english;

                const koreanPara = document.createElement("div");
                koreanPara.className = "large-text translation";
                koreanPara.textContent = paragraph.korean;

                paragraphContainer.appendChild(englishPara);
                paragraphContainer.appendChild(koreanPara);
            });
        }

        function populateVocabulary() {
            const vocabContainer = document.getElementById("vocabulary");
            for (const [english, korean] of Object.entries(vocabulary)) {
                const englishWord = document.createElement("div");
                englishWord.className = "large-text";
                englishWord.textContent = english;

                const koreanWord = document.createElement("div");
                koreanWord.className = "large-text translation";
                koreanWord.textContent = korean;

                vocabContainer.appendChild(englishWord);
                vocabContainer.appendChild(koreanWord);
            }
        }

        populateParagraphs();
        populateVocabulary();
    </script>
</body>
</html>
