<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북과학고 AI영어(2025수능완성 영어영역 1-7-0) English Paragraphs and Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .large-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .translation {
            color: #16a085;
        }
        button, input[type="file"] {
            margin: 0 5px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover, input[type="file"]:hover {
            background-color: #13856e;
        }
        #studyMode {
            display: none;
            text-align: center;
        }
        #sentenceDisplay, #wordDisplay {
            margin: 20px auto;
        }
        #sentenceDisplay, #wordDisplay {
            font-size: 56px; /* 문장 학습과 단어 학습의 글자 크기 */
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>전북과학고 AI영어(2025수능완성 영어영역 1-7-0) English Paragraphs and Vocabulary</h1>

    <div id="content">
        <div class="controls">
            <h2>Paragraph Translation</h2>
            <input type="file" id="audioFile" accept="audio/*">
            <button onclick="playAudio()">Play</button>
            <button onclick="stopAudio()">Stop</button>
        </div>

        <div id="paragraphs">
            <!-- Paragraphs will be dynamically loaded here -->
        </div>

        <div id="vocabulary">
            <h2>Vocabulary</h2>
        </div>

        <button onclick="startStudyMode()">학습모드</button>
    </div>

    <div id="studyMode">
        <div id="sentenceDisplay"></div>
        <div id="wordDisplay"></div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script>
        const paragraphs = [
            { english: "2024 Green Creek Community Color Run", korean: "2024 그린 크릭 커뮤니티 컬러 런" },
            { english: "Join us for a dynamic day of excitement and fitness at the Green Creek Community Color Run!", korean: "그린 크릭 커뮤니티 컬러 런에서 흥미진진하고 활기찬 하루를 함께하세요!" },
            { english: "Participants will have fun running or walking while getting splashed with vibrant, non-toxic colorful powder at different stations.", korean: "참가자들은 다양한 스테이션에서 활기차고 무독성의 컬러 가루를 맞으며 달리거나 걸으며 즐거운 시간을 보낼 수 있습니다." },
            { english: "Date: Saturday, September 14", korean: "날짜: 9월 14일 토요일" },
            { english: "Starting Location: Green Creek Park", korean: "출발 장소: 그린 크릭 공원" },
            { english: "Route Options: 1.5 km or 5 km", korean: "코스 옵션: 1.5km 또는 5km" },
            { english: "Registration", korean: "등록" },
            { english: "• The registration fee is ＄20 per person and includes a white T-shirt.", korean: "• 등록비는 1인당 20달러이며 흰색 티셔츠가 포함됩니다." },
            { english: "• The event is open to the first 500 participants who register online. On-site registration is not available.", korean: "• 이 행사는 온라인으로 등록한 선착순 500명만 참가할 수 있습니다. 현장 등록은 불가능합니다." },
            { english: "※ Notes", korean: "※ 주의사항" },
            { english: "• Water will be provided along the route.", korean: "• 코스 곳곳에서 물이 제공됩니다." },
            { english: "• Additional T-shirts and snacks will be available for purchase on the day of the event.", korean: "• 행사 당일 추가 티셔츠와 간식 구매가 가능합니다." },
            { english: "• We recommend wearing sunglasses or goggles to protect your eyes from the colored powder.", korean: "• 눈을 컬러 가루로부터 보호하기 위해 선글라스나 고글 착용을 권장합니다." },
            { english: "Visit www.greencreekcolorrun.org for more information.", korean: "자세한 정보는 www.greencreekcolorrun.org를 방문하세요." }
        ];

        const vocabulary = {
            "Green Creek Community Color Run": "그린 크릭 커뮤니티 컬러 런",
            "dynamic": "활기찬",
            "excitement": "흥분",
            "fitness": "건강",
            "participants": "참가자들",
            "fun": "재미있는",
            "running": "달리기",
            "walking": "걷기",
            "splashed": "뿌려지다",
            "vibrant": "활기찬",
            "non-toxic": "무독성의",
            "colorful powder": "컬러 가루",
            "stations": "스테이션",
            "Date": "날짜",
            "Saturday": "토요일",
            "September 14": "9월 14일",
            "Starting Location": "출발 장소",
            "Green Creek Park": "그린 크릭 공원",
            "Route Options": "코스 옵션",
            "1.5 km": "1.5km",
            "5 km": "5km",
            "Registration": "등록",
            "registration fee": "등록비",
            "＄20": "20달러",
            "per person": "1인당",
            "white T-shirt": "흰색 티셔츠",
            "first 500 participants": "선착순 500명",
            "register online": "온라인으로 등록하다",
            "on-site registration": "현장 등록",
            "not available": "불가능한",
            "Notes": "주의사항",
            "Water": "물",
            "provided": "제공되다",
            "route": "코스",
            "additional": "추가의",
            "snacks": "간식",
            "purchase": "구매",
            "day of the event": "행사 당일",
            "sunglasses": "선글라스",
            "goggles": "고글",
            "protect": "보호하다",
            "eyes": "눈",
            "colored powder": "컬러 가루",
            "recommend": "권장하다",
            "Visit": "방문하다",
            "www.greencreekcolorrun.org": "www.greencreekcolorrun.org",
            "more information": "자세한 정보"
        };

        let sentenceIndex = 0;
        let wordIndex = 0;
        let isRunning = true;

        function startStudyMode() {
            stopAudio(); // 학습모드 시작 시 MP3 재생 정지
            document.getElementById("content").style.display = "none";
            const studyMode = document.getElementById("studyMode");
            studyMode.style.display = "block";

            isRunning = true;

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    isRunning = false;
                    document.getElementById("studyMode").style.display = "none";
                    document.getElementById("content").style.display = "block";
                    sentenceIndex = 0;
                    wordIndex = 0;
                }
            });

            displayNextSentence();
        }

        function displayNextSentence() {
            if (!isRunning) return;

            const sentence = paragraphs[sentenceIndex];
            document.getElementById("sentenceDisplay").innerHTML = `
                <div>${sentence.english}</div>
                <div class="translation">${sentence.korean}</div>
            `;
            sentenceIndex = (sentenceIndex + 1) % paragraphs.length;

            const wordCount = sentence.english.split(" ").length;
            const displayTime = wordCount * 1000;

            setTimeout(() => {
                if (!isRunning) return;
                if (sentenceIndex === 0) {
                    document.getElementById("sentenceDisplay").innerHTML = "";
                    displayNextWord();
                } else {
                    displayNextSentence();
                }
            }, displayTime);
        }

        function displayNextWord() {
            if (!isRunning) return;

            const words = Object.entries(vocabulary);
            const word = words[wordIndex];
            document.getElementById("wordDisplay").innerHTML = `
                <div>${word[0]}</div>
                <div class="translation">${word[1]}</div>
            `;
            wordIndex = (wordIndex + 1) % words.length;

            setTimeout(() => {
                if (!isRunning) return;
                if (wordIndex === 0) {
                    document.getElementById("wordDisplay").innerHTML = "";
                    displayNextSentence();
                } else {
                    displayNextWord();
                }
            }, 2000);
        }

        function playAudio() {
            const fileInput = document.getElementById("audioFile");
            const audioPlayer = document.getElementById("audioPlayer");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const objectURL = URL.createObjectURL(file);
                audioPlayer.src = objectURL;
                audioPlayer.play();
            } else {
                alert("Please select an audio file.");
            }
        }

        function stopAudio() {
            const audioPlayer = document.getElementById("audioPlayer");
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        function populateParagraphs() {
            const paragraphContainer = document.getElementById("paragraphs");
            paragraphs.forEach(paragraph => {
                const englishPara = document.createElement("div");
                englishPara.className = "large-text";
                englishPara.textContent = paragraph.english;

                const koreanPara = document.createElement("div");
                koreanPara.className = "large-text translation";
                koreanPara.textContent = paragraph.korean;

                paragraphContainer.appendChild(englishPara);
                paragraphContainer.appendChild(koreanPara);
            });
        }

        function populateVocabulary() {
            const vocabContainer = document.getElementById("vocabulary");
            for (const [english, korean] of Object.entries(vocabulary)) {
                const englishWord = document.createElement("div");
                englishWord.className = "large-text";
                englishWord.textContent = english;

                const koreanWord = document.createElement("div");
                koreanWord.className = "large-text translation";
                koreanWord.textContent = korean;

                vocabContainer.appendChild(englishWord);
                vocabContainer.appendChild(koreanWord);
            }
        }

        populateParagraphs();
        populateVocabulary();
    </script>
</body>
</html>
