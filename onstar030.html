<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북과학고 AI영어(2025수능완성 영어영역 1-6-4) English Paragraphs and Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .large-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .translation {
            color: #16a085;
        }
        button, input[type="file"] {
            margin: 0 5px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover, input[type="file"]:hover {
            background-color: #13856e;
        }
        #studyMode {
            display: none;
            text-align: center;
        }
        #sentenceDisplay, #wordDisplay {
            margin: 20px auto;
        }
        #sentenceDisplay, #wordDisplay {
            font-size: 56px; /* 문장 학습과 단어 학습의 글자 크기 */
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>전북과학고 AI영어(2025수능완성 영어영역 1-6-4) English Paragraphs and Vocabulary</h1>

    <div id="content">
        <div class="controls">
            <h2>Paragraph Translation</h2>
            <input type="file" id="audioFile" accept="audio/*">
            <button onclick="playAudio()">Play</button>
            <button onclick="stopAudio()">Stop</button>
        </div>

        <div id="paragraphs">
            <!-- Paragraphs will be dynamically loaded here -->
        </div>

        <div id="vocabulary">
            <h2>Vocabulary</h2>
        </div>

        <button onclick="startStudyMode()">학습모드</button>
    </div>

    <div id="studyMode">
        <div id="sentenceDisplay"></div>
        <div id="wordDisplay"></div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script>
        const paragraphs = [
            { english: "Born in Jamaica, Barrington Irving grew up in Miami.", korean: "자메이카에서 태어난 배링턴 어빙은 마이애미에서 자랐습니다." },
            { english: "After he was introduced to aviation at age fifteen, he became licensed as a commercial, private pilot and as a flight instructor.", korean: "그는 15세에 항공을 접한 후 상업용 및 개인용 조종사, 비행 교관 면허를 취득했습니다." },
            { english: "His plane, a Columbia 400 aircraft, was built from donated parts at a cost of ＄300,000.", korean: "그의 비행기인 콜럼비아 400 항공기는 기증된 부품으로 제작되었으며 비용은 30만 달러였습니다." },
            { english: "Irving took a solo trip across the Atlantic to Europe, the Middle East, and Asia.", korean: "어빙은 대서양을 건너 유럽, 중동, 아시아를 혼자 여행했습니다." },
            { english: "Irving ended a 97-day 27,000-mile flight at Opa-locka Executive Airport outside Miami and became the first black and youngest pilot to fly solo around the globe.", korean: "어빙은 마이애미 외곽의 오파로카 행정 공항에서 97일간 27,000마일 비행을 마치고 세계를 혼자 비행한 최초의 흑인이자 최연소 조종사가 되었습니다." },
            { english: "The twenty-three-year-old pilot named his single-engine piston plane Inspiration, saying, 'That’s what I want to be to young people.'", korean: "23세의 조종사는 자신의 단발 피스톤 비행기에 영감(Inspiration)이라는 이름을 붙이며 '나는 젊은이들에게 그런 존재가 되고 싶다'고 말했습니다." },
            { english: "He aimed to lure young people away from the streets and encourage them to exceed his record-setting feat.", korean: "그는 젊은이들을 거리에서 벗어나게 하고 자신의 기록을 넘어서는 성과를 이루도록 격려하는 것을 목표로 했습니다." },
            { english: "He founded a non-profit organization, Experience Aviation Inc., which aimed to expose youth to careers in aviation.", korean: "그는 청소년들에게 항공 분야의 경력을 알리는 것을 목표로 하는 비영리 단체 Experience Aviation Inc.를 설립했습니다." }
        ];

        const vocabulary = {
            "Barrington Irving": "배링턴 어빙",
            "born": "태어나다",
            "Jamaica": "자메이카",
            "grew up": "자랐다",
            "Miami": "마이애미",
            "introduced to aviation": "항공을 접하다",
            "age fifteen": "15세",
            "licensed": "면허를 취득한",
            "commercial pilot": "상업용 조종사",
            "private pilot": "개인용 조종사",
            "flight instructor": "비행 교관",
            "plane": "비행기",
            "Columbia 400 aircraft": "콜럼비아 400 항공기",
            "donated parts": "기증된 부품",
            "cost": "비용",
            "＄300,000": "30만 달러",
            "solo trip": "혼자 여행",
            "Atlantic": "대서양",
            "Europe": "유럽",
            "Middle East": "중동",
            "Asia": "아시아",
            "97-day": "97일간",
            "27,000-mile flight": "27,000마일 비행",
            "Opa-locka Executive Airport": "오파로카 행정 공항",
            "outside": "외곽",
            "first black": "최초의 흑인",
            "youngest pilot": "최연소 조종사",
            "fly solo around the globe": "세계 일주를 혼자 비행하다",
            "twenty-three-year-old": "23세의",
            "single-engine piston plane": "단발 피스톤 비행기",
            "Inspiration": "영감",
            "young people": "젊은이들",
            "lure": "유혹하다",
            "away from the streets": "거리에서 벗어나게 하다",
            "encourage": "격려하다",
            "exceed": "넘어서다",
            "record-setting feat": "기록적인 성과",
            "founded": "설립했다",
            "non-profit organization": "비영리 단체",
            "Experience Aviation Inc.": "Experience Aviation Inc.",
            "expose": "알리다",
            "youth": "청소년",
            "careers in aviation": "항공 분야의 경력"
        };

        let sentenceIndex = 0;
        let wordIndex = 0;
        let isRunning = true;

        function startStudyMode() {
            stopAudio(); // 학습모드 시작 시 MP3 재생 정지
            document.getElementById("content").style.display = "none";
            const studyMode = document.getElementById("studyMode");
            studyMode.style.display = "block";

            isRunning = true;

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    isRunning = false;
                    document.getElementById("studyMode").style.display = "none";
                    document.getElementById("content").style.display = "block";
                    sentenceIndex = 0;
                    wordIndex = 0;
                }
            });

            displayNextSentence();
        }

        function displayNextSentence() {
            if (!isRunning) return;

            const sentence = paragraphs[sentenceIndex];
            document.getElementById("sentenceDisplay").innerHTML = `
                <div>${sentence.english}</div>
                <div class="translation">${sentence.korean}</div>
            `;
            sentenceIndex = (sentenceIndex + 1) % paragraphs.length;

            const wordCount = sentence.english.split(" ").length;
            const displayTime = wordCount * 1000;

            setTimeout(() => {
                if (!isRunning) return;
                if (sentenceIndex === 0) {
                    document.getElementById("sentenceDisplay").innerHTML = "";
                    displayNextWord();
                } else {
                    displayNextSentence();
                }
            }, displayTime);
        }

        function displayNextWord() {
            if (!isRunning) return;

            const words = Object.entries(vocabulary);
            const word = words[wordIndex];
            document.getElementById("wordDisplay").innerHTML = `
                <div>${word[0]}</div>
                <div class="translation">${word[1]}</div>
            `;
            wordIndex = (wordIndex + 1) % words.length;

            setTimeout(() => {
                if (!isRunning) return;
                if (wordIndex === 0) {
                    document.getElementById("wordDisplay").innerHTML = "";
                    displayNextSentence();
                } else {
                    displayNextWord();
                }
            }, 2000);
        }

        function playAudio() {
            const fileInput = document.getElementById("audioFile");
            const audioPlayer = document.getElementById("audioPlayer");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const objectURL = URL.createObjectURL(file);
                audioPlayer.src = objectURL;
                audioPlayer.play();
            } else {
                alert("Please select an audio file.");
            }
        }

        function stopAudio() {
            const audioPlayer = document.getElementById("audioPlayer");
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        function populateParagraphs() {
            const paragraphContainer = document.getElementById("paragraphs");
            paragraphs.forEach(paragraph => {
                const englishPara = document.createElement("div");
                englishPara.className = "large-text";
                englishPara.textContent = paragraph.english;

                const koreanPara = document.createElement("div");
                koreanPara.className = "large-text translation";
                koreanPara.textContent = paragraph.korean;

                paragraphContainer.appendChild(englishPara);
                paragraphContainer.appendChild(koreanPara);
            });
        }

        function populateVocabulary() {
            const vocabContainer = document.getElementById("vocabulary");
            for (const [english, korean] of Object.entries(vocabulary)) {
                const englishWord = document.createElement("div");
                englishWord.className = "large-text";
                englishWord.textContent = english;

                const koreanWord = document.createElement("div");
                koreanWord.className = "large-text translation";
                koreanWord.textContent = korean;

                vocabContainer.appendChild(englishWord);
                vocabContainer.appendChild(koreanWord);
            }
        }

        populateParagraphs();
        populateVocabulary();
    </script>
</body>
</html>
