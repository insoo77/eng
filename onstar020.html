<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북과학고 AI영어(2025수능완성 영어영역 1-4-4) English Paragraphs and Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .large-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .translation {
            color: #16a085;
        }
        button, input[type="file"] {
            margin: 0 5px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover, input[type="file"]:hover {
            background-color: #13856e;
        }
        #studyMode {
            display: none;
            text-align: center;
        }
        #sentenceDisplay, #wordDisplay {
            margin: 20px auto;
        }
        #sentenceDisplay, #wordDisplay {
            font-size: 56px; /* 문장 학습과 단어 학습의 글자 크기 */
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>전북과학고 AI영어(2025수능완성 영어영역 1-4-4) English Paragraphs and Vocabulary</h1>

    <div id="content">
        <div class="controls">
            <h2>Paragraph Translation</h2>
            <input type="file" id="audioFile" accept="audio/*">
            <button onclick="playAudio()">Play</button>
            <button onclick="stopAudio()">Stop</button>
        </div>

        <div id="paragraphs">
            <!-- Paragraphs will be dynamically loaded here -->
        </div>

        <div id="vocabulary">
            <h2>Vocabulary</h2>
        </div>

        <button onclick="startStudyMode()">학습모드</button>
    </div>

    <div id="studyMode">
        <div id="sentenceDisplay"></div>
        <div id="wordDisplay"></div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script>
        const paragraphs = [
            { english: "The key to bread is making a way to trap expanding gases in the dough.", korean: "빵을 만드는 핵심은 반죽 안에서 팽창하는 가스를 가두는 방법을 만드는 것입니다." },
            { english: "Adding water to flour and sugar allows for the hydration and mixing of proteins and carbohydrates.", korean: "밀가루와 설탕에 물을 추가하면 단백질과 탄수화물이 수화되고 혼합됩니다." },
            { english: "Kneading the dough stretches a protein called gluten, which allows for an interconnected network of protein ready to trap gas that is generated by the yeast.", korean: "반죽을 치대는 것은 글루텐이라고 불리는 단백질을 늘려 효모가 생성하는 가스를 가두는 단백질의 연결망을 형성합니다." },
            { english: "During the proofing step of making bread, the yeast converts sugar into energy-filled molecules, ethanol, carbon dioxide gas, and other flavorful by-products.", korean: "빵을 만드는 발효 단계에서 효모는 설탕을 에너지로 가득 찬 분자, 에탄올, 이산화탄소 가스 및 다른 풍미가 있는 부산물로 변환합니다." },
            { english: "The heat applied during baking allows the water to escape as steam, which expands the bread, links the gluten protein molecules further, and traps carbon dioxide gas.", korean: "굽는 동안 가해진 열은 물이 증기로 빠져나가게 하고, 빵을 팽창시키며, 글루텐 단백질 분자를 더 연결하고 이산화탄소 가스를 가둡니다." },
            { english: "While this is happening, the heat catalyzes chemical reactions between proteins and sugars, creating a beautiful brown color, a dense texture, and over 500 new aromatic compounds that waft to your nose.", korean: "이 과정에서 열은 단백질과 설탕 사이의 화학 반응을 촉매하여 아름다운 갈색, 밀도 있는 질감, 그리고 코로 퍼지는 500개 이상의 새로운 향기로운 화합물을 만듭니다." },
            { english: "Clearly there is a lot of science that goes into making a loaf of bread.", korean: "분명히 한 덩어리의 빵을 만드는 데 많은 과학이 들어갑니다." }
        ];

        const vocabulary = {
            "key": "핵심",
            "bread": "빵",
            "making": "만들기",
            "trap": "가두다",
            "expanding": "팽창하는",
            "gases": "가스들",
            "dough": "반죽",
            "adding": "추가하다",
            "water": "물",
            "flour": "밀가루",
            "sugar": "설탕",
            "allows": "허용하다",
            "hydration": "수화",
            "mixing": "혼합",
            "proteins": "단백질들",
            "carbohydrates": "탄수화물",
            "kneading": "치대다",
            "stretches": "늘리다",
            "gluten": "글루텐",
            "interconnected": "서로 연결된",
            "network": "망",
            "ready": "준비된",
            "generated": "생성된",
            "yeast": "효모",
            "proofing": "발효",
            "step": "단계",
            "converts": "변환하다",
            "sugar": "설탕",
            "energy-filled": "에너지로 가득 찬",
            "molecules": "분자들",
            "ethanol": "에탄올",
            "carbon dioxide": "이산화탄소",
            "gas": "가스",
            "by-products": "부산물",
            "heat": "열",
            "applied": "가해진",
            "baking": "굽기",
            "escape": "빠져나가다",
            "steam": "증기",
            "expands": "팽창하다",
            "links": "연결하다",
            "protein molecules": "단백질 분자",
            "traps": "가두다",
            "catalyzes": "촉매하다",
            "chemical reactions": "화학 반응",
            "between": "사이의",
            "proteins": "단백질들",
            "sugars": "설탕들",
            "beautiful": "아름다운",
            "brown color": "갈색",
            "dense": "밀도 있는",
            "texture": "질감",
            "aromatic compounds": "향기로운 화합물",
            "waft": "퍼지다",
            "nose": "코",
            "clearly": "분명히",
            "science": "과학",
            "loaf": "덩어리"
        };

        let sentenceIndex = 0;
        let wordIndex = 0;
        let isRunning = true;

        function startStudyMode() {
            stopAudio(); // 학습모드 시작 시 MP3 재생 정지
            document.getElementById("content").style.display = "none";
            const studyMode = document.getElementById("studyMode");
            studyMode.style.display = "block";

            isRunning = true;

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    isRunning = false;
                    document.getElementById("studyMode").style.display = "none";
                    document.getElementById("content").style.display = "block";
                    sentenceIndex = 0;
                    wordIndex = 0;
                }
            });

            displayNextSentence();
        }

        function displayNextSentence() {
            if (!isRunning) return;

            const sentence = paragraphs[sentenceIndex];
            document.getElementById("sentenceDisplay").innerHTML = `
                <div>${sentence.english}</div>
                <div class="translation">${sentence.korean}</div>
            `;
            sentenceIndex = (sentenceIndex + 1) % paragraphs.length;

            const wordCount = sentence.english.split(" ").length;
            const displayTime = wordCount * 1000;

            setTimeout(() => {
                if (!isRunning) return;
                if (sentenceIndex === 0) {
                    document.getElementById("sentenceDisplay").innerHTML = "";
                    displayNextWord();
                } else {
                    displayNextSentence();
                }
            }, displayTime);
        }

        function displayNextWord() {
            if (!isRunning) return;

            const words = Object.entries(vocabulary);
            const word = words[wordIndex];
            document.getElementById("wordDisplay").innerHTML = `
                <div>${word[0]}</div>
                <div class="translation">${word[1]}</div>
            `;
            wordIndex = (wordIndex + 1) % words.length;

            setTimeout(() => {
                if (!isRunning) return;
                if (wordIndex === 0) {
                    document.getElementById("wordDisplay").innerHTML = "";
                    displayNextSentence();
                } else {
                    displayNextWord();
                }
            }, 2000);
        }

        function playAudio() {
            const fileInput = document.getElementById("audioFile");
            const audioPlayer = document.getElementById("audioPlayer");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const objectURL = URL.createObjectURL(file);
                audioPlayer.src = objectURL;
                audioPlayer.play();
            } else {
                alert("Please select an audio file.");
            }
        }

        function stopAudio() {
            const audioPlayer = document.getElementById("audioPlayer");
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        function populateParagraphs() {
            const paragraphContainer = document.getElementById("paragraphs");
            paragraphs.forEach(paragraph => {
                const englishPara = document.createElement("div");
                englishPara.className = "large-text";
                englishPara.textContent = paragraph.english;

                const koreanPara = document.createElement("div");
                koreanPara.className = "large-text translation";
                koreanPara.textContent = paragraph.korean;

                paragraphContainer.appendChild(englishPara);
                paragraphContainer.appendChild(koreanPara);
            });
        }

        function populateVocabulary() {
            const vocabContainer = document.getElementById("vocabulary");
            for (const [english, korean] of Object.entries(vocabulary)) {
                const englishWord = document.createElement("div");
                englishWord.className = "large-text";
                englishWord.textContent = english;

                const koreanWord = document.createElement("div");
                koreanWord.className = "large-text translation";
                koreanWord.textContent = korean;

                vocabContainer.appendChild(englishWord);
                vocabContainer.appendChild(koreanWord);
            }
        }

        populateParagraphs();
        populateVocabulary();
    </script>
</body>
</html>
